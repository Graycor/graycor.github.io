       exact inline script and style hashed below and loads nothing from other sites: no web
       fonts (Google Fonts logged every visit), no CDNs. Run `node tools/csp.mjs` after editing
       either block, or the page will not start. -->

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2d3e;
      --accent: #4f8ef7;
      --accent-glow: rgba(79, 142, 247, 0.18);
      --text: #e8eaf0;
      --muted: #6b7080;
      /* Dark scrollbars and form controls, so the dialog's scroll strips aren't white. */
      color-scheme: dark;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Ubuntu, Arial, sans-serif;
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    /* subtle grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 48px 48px;
      opacity: 0.35;
      pointer-events: none;
    }

    .container {
      position: relative;
      text-align: center;
      max-width: 560px;
      width: 100%;
      animation: fadeUp 0.7s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .eyebrow {
      font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.75rem;
    }

    h1 {
      font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace;
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      line-height: 1.15;
    }

    h1 span { color: var(--accent); }

    .divider {
      width: 48px;
      height: 2px;
      background: var(--accent);
      margin: 1.75rem auto;
      border-radius: 2px;
    }

    .tagline {
      font-size: 0.95rem;
      color: var(--muted);
      letter-spacing: 0.04em;
      margin-bottom: 2.5rem;
    }

    /* --- Menu grid --- */
    .menu {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 1rem;
    }

    .menu-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.55rem;
      padding: 1.4rem 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      text-decoration: none;
      font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
    }

    .menu-btn:hover {
      border-color: var(--accent);
      box-shadow: 0 0 18px var(--accent-glow);
      transform: translateY(-2px);
    }

    .menu-btn .icon-green { color: #3fbf5f; }

    .menu-btn .icon {
      font-size: 1.6rem;
      line-height: 1;
    }

    /* --- Coming soon --- */
    .soon {
      margin-top: 3rem;
    }

    .soon h2 {
      font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace;
      font-size: 1rem;
      letter-spacing: 0.04em;
      margin-bottom: 0.4rem;
    }

    .soon .note {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 1.5rem;
    }

    .soon-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 0.85rem;
    }

    .soon-btn {
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.55rem;
      padding: 1.2rem 0.6rem 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
    }

    .soon-btn:hover, .soon-btn:focus-visible {
      border-color: var(--accent);
      box-shadow: 0 0 18px var(--accent-glow);
      transform: translateY(-2px);
      outline: none;
    }

    .soon-btn img {
      width: 52px;
      height: 52px;
      border-radius: 12px;
    }

    /* Corner ribbon: says "not out yet" before anyone clicks. */
    .soon-btn::after {
      content: 'Soon';
      position: absolute;
      top: 9px;
      right: -26px;
      width: 90px;
      padding: 2px 0;
      transform: rotate(40deg);
      background: var(--accent);
      color: #0f1117;
      font-size: 0.55rem;
      font-weight: 700;
      letter-spacing: 0.12em;
    }

    /* --- App detail dialog --- */
    dialog.app {
      margin: auto;
      width: min(760px, 100% - 1.5rem);
      max-height: calc(100% - 1.5rem);
      padding: 0;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 14px;
      text-align: left;
      scrollbar-color: var(--border) transparent;
    }

    dialog.app::backdrop {
      background: rgba(8, 9, 14, 0.78);
    }

    .app-body {
      padding: 1.6rem;
    }

    .app-head {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.2rem;
      padding-right: 2.5rem;
    }

    .app-head img {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      flex: none;
    }

    .app-head h2 {
      font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace;
      font-size: 1.35rem;
    }

    .app-head p {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .app-close {
      position: absolute;
      top: 0.9rem;
      right: 0.9rem;
      width: 2.2rem;
      height: 2.2rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font-size: 1.1rem;
      cursor: pointer;
    }

    .app-close:hover { border-color: var(--accent); }

    .app-summary {
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 1rem;
    }

    .app-features {
      margin: 0 0 1.4rem 1.2rem;
      font-size: 0.9rem;
      line-height: 1.55;
    }

    .app-features li { margin-bottom: 0.35rem; }

    .app-shots {
      display: flex;
      gap: 0.8rem;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-color: var(--border) transparent;
      padding-bottom: 0.6rem;
      margin-bottom: 1.4rem;
    }

    /* A table, so the caption wraps at the image's width instead of stretching the figure. */
    .app-shots figure {
      display: table;
      flex: 0 0 auto;
      max-width: 88%;
      scroll-snap-align: start;
    }

    .app-shots img {
      display: block;
      max-height: 300px;
      max-width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: zoom-in;
    }

    .app-shots figcaption {
      display: table-caption;
      caption-side: bottom;
      margin-top: 0.35rem;
      font-size: 0.75rem;
      color: var(--muted);
    }

    /* Tapping a screenshot swaps the strip for full-width images, one under another. */
    .app-shots.zoomed { display: block; }
    .app-shots.zoomed figure { max-width: 100%; margin-bottom: 1rem; }
    .app-shots.zoomed img { max-height: none; cursor: zoom-out; }

    .app-foot {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.8rem 1.2rem;
    }

    .app-dl {
      position: relative;
      display: inline-block;
      padding: 0.8rem 1.6rem;
      border-radius: 8px;
      background: var(--accent);
      color: #0f1117;
      font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace;
      font-size: 0.85rem;
      font-weight: 700;
      text-decoration: none;
      letter-spacing: 0.04em;
    }

    /* Unreleased: the button is there so the page reads the same once it ships,
       but greyed out, with no link, and banded with "Coming soon". */
    .app-dl[aria-disabled="true"] {
      background: #3a3e4f;
      color: #8a8fa0;
      cursor: not-allowed;
      overflow: hidden;
    }

    .app-dl[aria-disabled="true"]::after {
      content: 'Coming soon';
      position: absolute;
      left: -10%;
      right: -10%;
      top: 50%;
      transform: translateY(-50%) rotate(-6deg);
      padding: 2px 0;
      background: #f2b84b;
      color: #1a1d27;
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-align: center;
    }

    .app-platforms {
      font-size: 0.78rem;
      color: var(--muted);
      font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace;
    }

    .app-platforms a { color: var(--accent); }

    .footer {
      margin-top: 3rem;
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.06em;
      font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace;
    }
  </style>
</head>

  </script>
  <script>
    (() => {
      const apps = JSON.parse(document.getElementById('apps-data').textContent);
      const grid = document.getElementById('soon-grid');
      const dialog = document.getElementById('app');
      const $ = (id) => document.getElementById(id);

      for (const app of apps) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'soon-btn';
        const img = document.createElement('img');
        img.src = app.logo;
        img.alt = '';
        btn.append(img, app.name);
        btn.addEventListener('click', () => { location.hash = app.id; });
        grid.append(btn);
      }

      function show(app) {
        $('app-logo').src = app.logo;
        $('app-name').textContent = app.name;
        $('app-tagline').textContent = app.tagline;
        $('app-summary').textContent = app.summary;
        $('app-features').replaceChildren(...app.features.map((f) => {
          const li = document.createElement('li');
          li.textContent = f;
          return li;
        }));
        const shots = $('app-shots');
        shots.classList.remove('zoomed');
        shots.hidden = app.shots.length === 0;
        shots.replaceChildren(...app.shots.map((s) => {
          const fig = document.createElement('figure');
          const img = document.createElement('img');
          img.src = s.src;
          img.alt = s.caption;
          img.loading = 'lazy';
          const cap = document.createElement('figcaption');
          cap.textContent = s.caption;
          fig.append(img, cap);
          return fig;
        }));
        const dl = $('app-dl');
        if (app.released) {
          dl.href = `https://github.com/${app.repo}/releases/latest`;
          dl.removeAttribute('aria-disabled');
          dl.removeAttribute('tabindex');
        } else {
          // No href at all, so nothing leads to a private repo's 404.
          dl.removeAttribute('href');
          dl.setAttribute('aria-disabled', 'true');
          dl.setAttribute('role', 'link');
          dl.tabIndex = -1;
        }
        $('app-platforms').textContent = app.platforms;
        if (app.more) {
          const more = document.createElement('a');
          more.href = app.more;
          more.textContent = 'More about ' + app.name;
          $('app-platforms').append(' · ', more);
        }
        if (!dialog.open) dialog.showModal();
        dialog.scrollTop = 0;
      }

      // The hash names the open app, so a link like graycor.github.io/#signet opens straight to it
      // and the phone's back button closes it.
      function route() {
        const app = apps.find((a) => a.id === location.hash.slice(1));
        if (app) show(app);
        else if (dialog.open) dialog.close();
      }

      dialog.addEventListener('close', () => {
        if (location.hash) history.pushState('', '', location.pathname + location.search);
      });
      $('app-close').addEventListener('click', () => dialog.close());
      // A tap on the backdrop lands on the dialog itself, not on anything inside it.
      dialog.addEventListener('click', (e) => { if (e.target === dialog) dialog.close(); });
      $('app-shots').addEventListener('click', (e) => {
        if (e.target.tagName === 'IMG') e.currentTarget.classList.toggle('zoomed');
      });
      window.addEventListener('hashchange', route);
      route();
    })();
  </script>
</body>
